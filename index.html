<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Private Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f0f2f5; margin: 0; }
        #chat { width: 100%; max-width: 500px; height: 400px; border: 1px solid #ddd; background: #fff; overflow-y: auto; margin-bottom: 10px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 12px; cursor: pointer; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #008f6f; }
        .secondary-btn { background: #6c757d; font-size: 14px; }
        .system-msg { color: #888; font-size: 0.85em; text-align: center; margin: 10px 0; font-style: italic; }
        img { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .id-container { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px dashed #00a884; width: 100%; max-width: 500px; }
    </style>
</head>
<body>
    <div class="id-container">
        <strong>Твой ID:</strong> <span id="my-id">Загрузка...</span>
        <div style="display: flex; gap: 5px; justify-content: center; margin-top: 10px;">
            <button class="secondary-btn" onclick="copyMyID()">📋 Копировать ID</button>
            <button class="secondary-btn" onclick="shareLink()">🔗 Ссылка для друга</button>
        </div>
    </div>
    
    <div id="chat"></div>

    <div class="controls">
        <input type="text" id="remote-id" placeholder="ID друга (подставится сам по ссылке)">
        <input type="password" id="chat-password" placeholder="Пароль шифрования" value="12345">
        <button onclick="connectToFriend()">Установить связь</button>
        <hr style="width: 100%; border: 0.5px solid #eee;">
        <div style="display: flex; gap: 5px;">
            <input type="text" id="message-input" placeholder="Сообщение..." style="flex: 1;">
            <button onclick="sendMessage()">Send</button>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="sendPhoto(this)">
        <button class="secondary-btn" onclick="document.getElementById('file-input').click()">📷 Отправить фото</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
